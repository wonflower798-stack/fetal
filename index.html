<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>태아 CBT 학습</title><style>
:root{--navy:#102a43;--blue:#1769aa;--green:#198754;--red:#c0394b;--paper:#fff;--line:#d8e2ec;--bg:#f3f6f9;--muted:#5f6f80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1d2935;font-family:system-ui,'Apple SD Gothic Neo','NanumGothic',sans-serif;line-height:1.6}header{background:var(--navy);color:#fff}.head{max-width:940px;margin:auto;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-weight:800;font-size:18px}.brand small{font-weight:400;font-size:12px;opacity:.75;display:block}.metric{display:flex;gap:20px;font-size:13px}.metric b{color:#a8dcff;font-size:18px;margin-left:4px}main{max-width:860px;margin:28px auto;padding:0 16px}.guide{background:#fff6dc;border-left:4px solid #e6a521;border-radius:6px;padding:12px 15px;margin-bottom:16px;font-size:14px}.card{background:white;border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:0 4px 14px #17324d12}.progress{height:7px;background:#e4ebf1}.progress>i{display:block;height:100%;width:0;background:var(--green);transition:.25s}.topline{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}.tag{background:var(--blue);color:white;padding:3px 10px;border-radius:99px;font-weight:750}.question{padding:28px 28px 15px;font-weight:750;font-size:20px;white-space:pre-line;letter-spacing:-.25px}.opts{padding:0 22px 22px;display:grid;gap:9px}.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:white;border:1px solid #cbd7e3;border-radius:7px;padding:14px 15px;font:inherit;color:inherit;cursor:pointer}.opt:hover:not(:disabled){border-color:var(--blue);background:#f4faff}.opt:disabled{cursor:default}.n{font-weight:800;color:var(--blue);min-width:20px}.okchoice{border-color:var(--green)!important;background:#eaf8f0!important}.badchoice{border-color:var(--red)!important;background:#fff0f2!important}.feedback{display:none;margin:0 26px 22px;padding:15px;border-radius:7px;white-space:pre-line;font-size:14px}.feedback.ok{display:block;background:#e8f7ee;color:#10633f}.feedback.bad{display:block;background:#fff0f2;color:#942939}.actions{padding:0 26px 26px;text-align:right}#next,.restart{border:0;border-radius:7px;background:var(--blue);color:#fff;font:inherit;font-weight:750;padding:12px 19px;cursor:pointer;display:none}.end{display:none;text-align:center;padding:48px 20px}.end h1{color:var(--navy);margin:0 0 8px}.end p{color:var(--muted)}.end .restart{display:inline-block}.foot{font-size:12px;color:#7b8996;text-align:center}@media(max-width:520px){main{margin-top:18px}.question{font-size:18px;padding:21px 18px 12px}.opts{padding:0 13px 18px}.feedback{margin:0 18px 18px}.actions{padding:0 18px 19px}}
</style></head><body><header><div class="head"><div class="brand">국가고시 CBT 학습<small>모성간호학 · 태아</small></div><div class="metric"><span>정답 <b id="score">0</b>/12</span><span>풀이 <b id="tries">0</b></span></div></div></header><main><p class="guide">문항을 선택하면 <b>즉시 정답과 핵심 해설</b>이 표시됩니다. 정답 처리된 문항은 다시 출제하지 않으며, 오답 문항은 다른 문항 뒤에 다시 출제되어 복습할 수 있습니다. <b>12문항 모두 정답</b>이면 종료됩니다.</p><section class="card" id="exam"><div class="progress"><i id="bar"></i></div><div class="topline"><b class="tag" id="label">문제</b><span id="state">무작위 출제</span></div><div class="question" id="q"></div><div class="opts" id="opts"></div><div class="feedback" id="fb"></div><div class="actions"><button id="next" onclick="next()">다음 문제 →</button></div></section><section class="card end" id="end"><h1>🎉 전체 정답 달성!</h1><p id="result"></p><button class="restart" onclick="start()">새 학습 시작</button></section><p class="foot">학습용 CBT · 결과는 브라우저에 저장되지 않습니다.</p></main><script>
const bank=[{"q": "의사가 태아의 위치를 확인하기 위하여 임부를 복부 촉진법으로 진찰하려고 할 때 간호조무사가 해야 할 일로 옳은 것은?", "o": ["내진 준비를 한다.", "기계 준비를 한다.", "소변을 보지 않도록 한다.", "일회용 장갑을 준비한다.", "임부를 똑바로 누위고 무릎을 약간 구부리게 한다."], "a": 4}, {"q": "태아가 둔위나 횡위로 확인되었을 때 두정위로 교정해주기에 적합한 시기로 옳은 것은?", "o": ["임신 전반기", "임신 4~5개월", "임신 7~8개월", "임신 5~6개월", "아무 때나 상관 없다."], "a": 2}, {"q": "임신 말기에 태아의 위치를 교정하기 위해서 취하는 자세로 옳은 것은?", "o": ["측와위", "바로 누운 자세(앙와위)", "엎드린 자세(복와위)", "무릎가슴 자세(슬흉위)", "골반내진 자세(절석위)"], "a": 3}, {"q": "임신 2기 여성의 태반 위치를 확인하고자 복부초음파 검사 시 간호조무사의 간호로 옳은 것은?", "o": ["검사가 끝날 때까지 소변을 참게 한다.", "초음파 젤은 차게 준비한다.", "복부를 포르말린으로 소독한다.", "골반내진 자세(절석위)를 취하게 한다.", "반드시 대상자에게 금식하게 한다."], "a": 0}, {"q": "양수천자로 인해 임부에게 나타날 수 있는 합병증으로 주의 깊게 사정해야 할 내용으로 옳은 것은?", "o": ["태동 양상의 변화", "지속적인 두통", "구역, 구토, 설사", "하지부종", "태반의 위치 변화"], "a": 0}, {"q": "임신으로 인해 태아와 함께 태아가 자궁 내 생활을 유지하도록 돕는 태아의 부속물로 옳은 것은?", "o": ["난막, 태반, 양수, 탯줄(제대)", "태반, 난관, 자궁, 난막", "양수, 자궁, 난관, 탯줄(제대)", "탯줄(제대), 태아, 양수, 태반", "자궁, 난관, 양수, 태반"], "a": 0}, {"q": "자궁 내에서 태아를 싸는 난막의 외층으로서, 모체측에서 생기는 막에 해당되는 것은?", "o": ["탈락막", "양막", "융모막", "난막", "영양막"], "a": 0}, {"q": "태반에 대한 설명으로 옳은 것은?", "o": ["태아의 신진대사 노폐물을 축적시킨다.", "모체측의 양막이 태반으로 변화한다.", "임신 5개월에 완성되며, 태아 체중에서 1/3을 차지한다.", "모체의 노폐물을 거르는 기능을 한다.", "태아에게 산소와 영양을 공급해 준다."], "a": 4}, {"q": "탯줄(제대) 속에는 3개의 혈관이 포함되어 있는데, 이 혈관의 구성으로 옳은 것은?", "o": ["배꼽(제대)동맥 1개, 배꼽(제대)정맥 2개", "배꼽(제대)동맥 1개, 배꼽(제대)정맥 1개", "배꼽(제대)동맥 2개, 배꼽(제대)정맥 1개", "배꼽(제대)동맥 2개, 배꼽(제대)정맥 2개", "배꼽(제대)동맥 3개, 배꼽(제대)정맥 1개"], "a": 2}, {"q": "태아를 순환하고 나온 혈액이 태반으로 들어갈 때 이용되는 혈관으로 옳은 것은?", "o": ["배꼽(제대)정맥", "배꼽(제대)동맥", "관상동맥", "난원공", "하대정맥"], "a": 1}, {"q": "임신 중 태아의 체온유지 및 운동, 유착방지, 분만시 산도를 깨끗하게 해주는 산도윤활제 역할을 하는 것은?", "o": ["태반", "탯줄(제대)", "양수", "자궁", "자궁경관"], "a": 2}, {"q": "양수의 기능으로 옳은 것은?", "o": ["외부자극으로부터 자궁을 보호한다.", "태아에게 영양을 제공한다.", "호르몬을 생성한다.", "태아에게 산소를 공급한다.", "태아에게 균일한 체온을 유지시킨다."], "a": 4}], sym=['①','②','③','④','⑤'];let remaining,queue,current,score,tries,answered;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function explanation(x){const q=x.q,a=x.o[x.a];let e='문항의 핵심 개념을 정리해 보세요.';if(/복부 촉진|레오폴드|태아의 위치/.test(q))e='복부 촉진 시 복부 근육의 긴장을 줄이기 위해 임부를 편안히 바로 눕히고 무릎을 약간 굽히게 합니다.';else if(/둔위|횡위|교정|무릎가슴/.test(q))e='둔위·횡위의 교정 시기와 슬흉위는 태아 위치 교정과 연관된 기본 개념입니다.';else if(/초음파/.test(q))e='복부초음파에서는 방광 충만이 골반 내 구조와 태반 위치 관찰에 도움이 될 수 있습니다.';else if(/양수천자/.test(q))e='양수천자 후에는 태아 상태를 반영하는 태동 변화 등 이상 여부를 관찰해야 합니다.';else if(/부속물|난막|태반|탯줄/.test(q))e='태아 부속물은 태아의 성장과 자궁 내 생활 유지에 필요한 구조물이며, 각 구조의 역할을 구분해 기억하세요.';else if(/제대.*혈관|혈액.*태반/.test(q))e='제대는 제대동맥 2개와 제대정맥 1개로 이루어지며, 제대동맥은 태아에서 태반으로 혈액을 보냅니다.';else if(/양수/.test(q))e='양수는 태아를 완충하고 일정한 체온을 유지하며, 태아 운동과 분만 시 산도 윤활에 도움을 줍니다.';return '해설: '+e+' 따라서 정답은 '+sym[x.a]+' '+a+'입니다.'}
function render(){document.getElementById('score').textContent=score;document.getElementById('tries').textContent=tries;document.getElementById('bar').style.width=(score/12*100)+'%'}
function start(){remaining=new Set(bank.map((_,i)=>i));queue=shuffle([...remaining]);score=0;tries=0;document.getElementById('end').style.display='none';document.getElementById('exam').style.display='block';next()}
function next(){if(score===12)return done();if(!queue.length)queue=shuffle([...remaining]);current=queue.shift();answered=false;document.getElementById('label').textContent='문제 · 남은 정답 '+(12-score);document.getElementById('state').textContent='문제은행 무작위 출제';document.getElementById('q').textContent=bank[current].q;const box=document.getElementById('opts');box.innerHTML='';bank[current].o.forEach((v,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="n">'+sym[i]+'</span><span></span>';b.lastChild.textContent=v;b.onclick=()=>answer(i);box.appendChild(b)});const f=document.getElementById('fb');f.className='feedback';f.textContent='';document.getElementById('next').style.display='none';render()}
function answer(choice){if(answered)return;answered=true;tries++;const x=bank[current],buttons=[...document.querySelectorAll('.opt')],ok=choice===x.a;buttons.forEach((b,i)=>{b.disabled=true;if(i===x.a)b.classList.add('okchoice');else if(i===choice)b.classList.add('badchoice')});const f=document.getElementById('fb');if(ok){remaining.delete(current);score++;f.className='feedback ok';f.textContent='정답입니다.\n'+explanation(x)}else{queue.push(current);f.className='feedback bad';f.textContent='오답입니다.\n'+explanation(x)+'\n이 문항은 다른 문항을 푼 뒤 다시 출제됩니다.'}document.getElementById('next').textContent=score===12?'결과 확인':'다음 문제 →';document.getElementById('next').style.display='inline-block';render()}
function done(){document.getElementById('exam').style.display='none';document.getElementById('end').style.display='block';document.getElementById('result').textContent='총 '+tries+'회 풀이로 태아 문제은행 12문항을 모두 정답 처리했습니다.'}
start();</script></body></html>
